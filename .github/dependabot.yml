version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    # (while Rust 1.77 is the oldest supported, workspace rust-version: libloading 0.9 needs 1.88)
    ignore:
      - dependency-name: libloading
        versions: [">=0.9"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
