name: Release

# A version tag (v0.1.0) builds everything, tests the wheels, and publishes: PyPI, crates.io and a GitHub
# release with the C libraries. Run by hand (Actions tab) it builds and tests only, publishing nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: Wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/hdmv-menus-py
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/hdmv-menus-py/dist

  sdist:
    name: Source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/hdmv-menus-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: crates/hdmv-menus-py/dist

  test-wheels:
    name: Test the wheel (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: windows-latest, python: "3.9" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install the built wheel (never a build from source)
        run: |
          pip install pytest Pillow
          pip install --no-index --find-links dist --only-binary :all: hdmv-menus
      - run: pytest -q crates/hdmv-menus-py/tests

  c-libraries:
    name: C library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p hdmv-menus-c
      - name: Package the libraries and the header
        shell: bash
        run: |
          out=hdmv-menus-c-${{ matrix.name }}
          mkdir -p $out/include $out/lib
          cp crates/hdmv-menus-c/include/hdmv_menus.h $out/include/
          cp LICENSE README.md $out/
          for f in hdmvmenus.dll hdmvmenus.dll.lib hdmvmenus.lib libhdmvmenus.so libhdmvmenus.a libhdmvmenus.dylib; do
            if [ -f target/release/$f ]; then cp target/release/$f $out/lib/; fi
          done
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a $out.zip $out >/dev/null; else tar czf $out.tar.gz $out; fi
      - uses: actions/upload-artifact@v7
        with:
          name: c-${{ matrix.name }}
          path: hdmv-menus-c-${{ matrix.name }}.*

  crate:
    name: Crate (checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p hdmv-menus --dry-run

  # ---- publishing: only for a tag ----

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-wheels, sdist, crate, c-libraries]
    runs-on: ubuntu-latest
    # PyPI's trusted publishing: no token kept anywhere. Set up once on pypi.org for this repository,
    # workflow "release.yml", environment "pypi".
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-wheels, sdist, crate, c-libraries]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # a crates.io API token, saved in the repository's secrets as CARGO_REGISTRY_TOKEN
      - run: cargo publish -p hdmv-menus
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pypi, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/hdmv-menus-c-*
            artifacts/*.whl
            artifacts/*.tar.gz
