[package]
name = "hdmv-menus-c"
description = "C bindings for hdmv-menus: a shared and a static library, and include/hdmv_menus.h."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# libhdmvmenus.so / hdmvmenus.dll / libhdmvmenus.dylib (as libbluray's; not "hdmv_menus", the Rust crate's,
# whose command-line tool's files would collide with it)
name = "hdmvmenus"
crate-type = ["cdylib", "staticlib"]

[dependencies]
hdmv-menus = { path = "../hdmv-menus" }
serde = "1"
serde_json = "1"

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
